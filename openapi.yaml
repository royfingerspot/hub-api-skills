      summary: Set default webhook URL for device
      description: >
        Sets the default webhook URL used for async command results.
        Overrides the V2_DEFAULT_WEBHOOK_URL env var for this device.
        This endpoint is synchronous — returns directly, no callback webhook.
      operationId: setWebhook
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      requestBody:
        required: true
        content:
          application/json:
