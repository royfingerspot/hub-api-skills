          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # 24. PUT /v1/{cloud_id}/credentials — Update Device Password in Registry
  # ==========================================================================
  /v1/{cloud_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
    put:
      tags: [Device]
      summary: Update device registry password
      description: >
        Updates the device's login password stored in the NATS device-registry KV.
        Synchronous — returns directly. Does not send a command to the device itself.
      operationId: updateDevicePassword
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: New device login password.
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  message:
                    type: string
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found in registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Registry write failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Device]
      summary: Remove device from registry
      description: >
        Deletes the device entry from the NATS device-registry KV.
        Synchronous — returns directly.
      operationId: deleteDeviceFromRegistry
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      responses:
        '200':
          description: Device removed from registry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found in registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Registry delete failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # 25. GET /v1/devices — List Devices
  # ==========================================================================
  /v1/devices:
    get:
      tags: [Devices]
      summary: List all registered devices (DEV ONLY)
      description: >
        Returns all cloud IDs from the devices file.
      operationId: listDevices
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      parameters:
        - $ref: '#/components/parameters/ReferenceIdHeader'
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: Filter devices by cloud ID prefix (development only).
      responses:
        '200':
          description: List of device cloud IDs.
          content:
            application/json:
              schema:
                type: object
                required: [devices, total]
                properties:
                  devices:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    # ========================================================================
    # 25. POST /v1/devices — Add Device
    # ========================================================================
    post:
      tags: [Devices]
      summary: Register a new device (DEV ONLY)
      description: >
        Adds a cloud ID to the devices file. If brand is provided, also
        creates a device entry in the NATS KV device-registry.
      operationId: addDevice
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      parameters:
        - $ref: '#/components/parameters/ReferenceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cloudId]
              properties:
                cloudId:
                  type: string
                  description: Device cloud ID to register.
                brand:
                  type: string
                  description: Device brand (e.g. "vida", "vivo"). If provided, also creates a registry entry.
                username:
                  type: string
                  description: Device login username.
                password:
                  type: string
                  description: Device login password.
      responses:
        '200':
          description: Device registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  message:
                    type: string
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # 26. DELETE /v1/devices/{cloud_id} — Remove Device
  # ==========================================================================
  /v1/devices/{cloud_id}:
    delete:
      tags: [Devices]
      summary: Remove a device (DEV ONLY)
      description: >
        Removes a cloud ID from the devices file.
      operationId: removeDevice
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      parameters:
        - $ref: '#/components/parameters/ReferenceIdHeader'
        - name: cloud_id
          in: path
          required: true
          schema:
            type: string
          description: Device cloud ID to remove.
      responses:
        '200':
          description: Device removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

# ============================================================================
# REALTIME WEBHOOK — Attendance Push
# ============================================================================
webhooks:
  realtimeAttendance:
    post:
      summary: Real-time attendance event push
      description: >
        Pushed per-device when a user scans at the device. Not wrapped in
        WebhookSuccess — this is a standalone push. No referenceId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendancePushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

  realtimeVerificationFailed:
    post:
      summary: Real-time verification failed event push
      description: >
        Pushed per-device when a verification attempt is rejected
        (expired validity, unrecognised credential, anti-spoof failure, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationFailedPushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

  realtimeDoorEvent:
    post:
      summary: Real-time door event push
      description: >
        Pushed per-device for door state changes (open, close, alarm).
        The event field differentiates: "doorOpen", "doorClose", "doorAlarm".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoorEventPushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

  realtimeDoorbell:
    post:
      summary: Real-time doorbell event push
      description: >
        Pushed per-device when the doorbell button is pressed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoorbellPushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

  realtimeTamper:
    post:
      summary: Real-time tamper event push
      description: >
        Pushed per-device when physical tampering is detected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TamperPushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

  realtimeDeviceEvent:
    post:
      summary: Real-time device event push (alarm, exception, operation)
      description: >
        Pushed per-device for alarm, exception, and operation events.
        The event field differentiates: "alarm", "exception", "operation".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEventPushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

  realtimeUserChange:
    post:
      summary: Real-time user change event push
      description: >
        Pushed per-device when user data is added, modified, or deleted
        directly on the device (not through the hub).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChangePushPayload'
      responses:
        '200':
          description: Webhook acknowledged.
        '4XX':
          description: Error (retried up to 5 times).

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    CloudIdParam:
      name: cloud_id
      in: path
      required: true
      schema:
        type: string
      description: The device's unique cloud identifier.
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The user's employee number.
    ReferenceIdHeader:
      name: X-Reference-ID
      in: header
      required: true
      schema:
        type: string
      description: Client-supplied correlation ID for tracking the request.
    WebhookUrlHeader:
      name: X-Webhook-URL
      in: header
      required: false
      schema:
        type: string
      description: >
        Comma-separated extra webhook URLs for this request. The payload is
        sent to the device's registered webhook URL AND every URL in this list
        (up to V2_WEBHOOK_MAX_URLS, default 3). Takes precedence over the
        per-device default for additional delivery. Example:
        http://relay:3000/__webhook/relay?sid=abc,https://my-server.com/hook

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ------------------------------------------------------------------
    # Shared request/response
    # ------------------------------------------------------------------
    AttendanceRecord:
      type: object
      properties:
        employeeNo:
          type: string
        name:
          type: string
        cardNo:
          type: string
        eventTime:
          type: string
        verifyMode:
          type: string
        attendanceStatus:
          type: string
        userType:
          type: string
        serialNumber:
          type: string
        cloudId:
          type: string
        image:
          type: string
          nullable: true
        workCode:
          type: string

    SetUserRequest:
      type: object
      required: [employeeNo, name]
      properties:
        employeeNo:
          type: string
          description: User ID on the device.
        name:
          type: string
          description: User name.
        userType:
          type: string
          enum: [normal, admin, visitor, user, operator, manager, supervisor]
          description: |
            Standard brands (ZKTeco, Vivo, Vida): normal, admin, visitor
            Revo: all values including user, operator, manager, supervisor
        password:
          type: string
          description: User password (plaintext).
        fingerprints:
          type: array
          items:
            $ref: '#/components/schemas/Fingerprint'
        faceData:
          type: string
          description: Base64 face data.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        veins:
          type: array
          items:
            type: string
        valid:
          $ref: '#/components/schemas/ValidPeriod'
          nullable: true

    AckResponse:
      type: object
      required: [referenceId, status, deviceStatus, message, webhookUrls]
      properties:
        referenceId:
          type: string
        status:
          type: string
          enum: [queued]
        deviceStatus:
          type: string
          enum: [registered, unauthenticated, connected, offline]
        message:
          type: string
        webhookUrls:
          type: array
          items:
            type: string
            format: uri
          description: All URLs the callback will be sent to (customer webhook + any X-Webhook-URL extras).

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - ERR_DEVICE_NOT_FOUND
            - ERR_DEVICE_OFFLINE
            - ERR_DEVICE_TIMEOUT
            - ERR_DEVICE_BUSY
            - ERR_INVALID_PARAMS
            - ERR_DATE_RANGE
            - ERR_UNSUPPORTED
            - ERR_INTERNAL
            - ERR_UNAUTHORIZED
        message:
          type: string

    WebhookFailed:
      type: object
      required: [referenceId, status, commandType, error]
      properties:
        referenceId:
          type: string
        status:
          type: string
          enum: [failed]
        commandType:
          type: string
          description: >
            The command type that was executed (e.g. "getUser", "setUser",
            "setTime", "reboot", etc.).
        error:
          $ref: '#/components/schemas/Error'

    OperationResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    # ------------------------------------------------------------------
    # Webhook URL customization
    # ------------------------------------------------------------------
    SetWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Webhook URL for this device.

    SetWebhookResponse:
      type: object
      required: [referenceId, status, message]
      properties:
        referenceId:
          type: string
        status:
          type: string
          enum: [ok]
        message:
          type: string

    TestWebhookResponse:
      type: object
      required: [reachable, responseTimeMs]
      properties:
        reachable:
          type: boolean
          description: Whether the webhook URL returned a success status (2xx or 3xx).
        statusCode:
          type: integer
          description: HTTP status code from the webhook URL.
        responseTimeMs:
          type: integer
          description: Round-trip time in milliseconds.
        error:
          type: string
          description: Error message if the URL is unreachable.

    # ------------------------------------------------------------------
    # Device data
    # ------------------------------------------------------------------
    DeviceInfoData:
      type: object
      required: [cloudId, brand, serial, lastActivity, status, capabilities]
      properties:
        cloudId:
          type: string
        brand:
          type: string
        serial:
          type: string
        lastActivity:
          type: string
        status:
          type: string
          enum: [registered, unauthenticated, connected, offline]
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'

    DeviceActivityResponse:
      type: object
      required: [status, lastSeen]
      properties:
        status:
          type: string
          enum: [connected, registered, unauthenticated, offline]
          description: Current connectivity status of the device.
        lastSeen:
          type: string
          description: RFC 3339 timestamp of last activity. Empty string if offline.

    DeviceCapabilities:
      type: object
      properties:
        setTime:
          type: boolean
        reboot:
          type: boolean
        openDoor:
          type: boolean
        closeDoor:
          type: boolean
        doorStatus:
          type: boolean
        getUserInfo:
          type: boolean
        setUserInfo:
          type: boolean
        deleteUser:
          type: boolean
        getAllUsers:
          type: boolean
        getAllUserIDs:
          type: boolean
        getUserFace:
          type: boolean
        setUserFace:
          type: boolean
        deleteUserFace:
          type: boolean
        getUserCard:
          type: boolean
        setUserCard:
          type: boolean
        deleteUserCard:
          type: boolean
        getUserFinger:
          type: boolean
        getUserAllFinger:
          type: boolean
        setUserFinger:
          type: boolean
        setUserAllFinger:
          type: boolean
        deleteUserFinger:
          type: boolean
        deleteUserAllFinger:
          type: boolean
        getUserPassword:
          type: boolean
        setUserPassword:
          type: boolean
        captureUserFinger:
          type: boolean
        captureUserCard:
          type: boolean
        enrollUserFinger:
          type: boolean
        enrollUserFace:
          type: boolean
        enrollUserVein:
          type: boolean
        getAttLog:
          type: boolean
        getTimezone:
          type: boolean
        setTimezone:
          type: boolean
        timezoneLock:
          type: boolean
        getUserFullInfo:
          type: boolean
        setUserFullInfo:
          type: boolean
        deleteFullUserInfo:
          type: boolean
        batchDeleteFullUserInfo:
          type: boolean

    # ------------------------------------------------------------------
    # User data
    # ------------------------------------------------------------------
    UserInfo:
      type: object
      required: [employeeNo, name, userType]
      properties:
        employeeNo:
          type: string
        name:
          type: string
        userType:
          type: string
        valid:
          $ref: '#/components/schemas/ValidPeriod'
          nullable: true
        password:
          type: string

    UserDetail:
      type: object
      required: [employeeNo, name, userType]
      properties:
        employeeNo:
          type: string
        name:
          type: string
        userType:
          type: string
        fingerprints:
          type: array
          items:
            $ref: '#/components/schemas/Fingerprint'
        faceData:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        password:
          type: string
        veins:
          type: array
          items:
            type: string
        valid:
          $ref: '#/components/schemas/ValidPeriod'
          nullable: true

    GetAllUserIdsResult:
      type: object
      required: [total, pin_arr]
      properties:
        total:
          type: integer
          description: Total number of user IDs.
        pin_arr:
          type: array
          description: List of user IDs/PINs.
          items:
            type: string

    Fingerprint:
      type: object
      required: [fingerNo]
      properties:
        fingerNo:
          type: integer
          minimum: 0
          maximum: 10
        fingerData:
          type: string

    Card:
      type: object
      required: [cardNo]
      properties:
        cardNo:
          type: string
        cardType:
          type: string

    # ------------------------------------------------------------------
    # Password credential schemas
    # ------------------------------------------------------------------
    GetUserPasswordResponse:
      type: object
      required: [employeeNo, password]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        password:
          type: string
          description: User password (plaintext).

    SetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: New password (plaintext).

    # ------------------------------------------------------------------
    # Card credential schemas
    # ------------------------------------------------------------------
    GetUserCardResponse:
      type: object
      required: [employeeNo, cards]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'

    SetUserCardRequest:
      type: object
      required: [cardNo]
      properties:
        cardNo:
          type: string
          description: Card number.
        cardType:
          type: string
          enum: [normalCard, hijackCard]
          description: "Card type (default: normalCard)."

    # ------------------------------------------------------------------
    # Finger credential schemas
    # ------------------------------------------------------------------
    GetUserFingerResponse:
      type: object
      required: [employeeNo, fingerprints]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        fingerprints:
          type: array
          items:
            $ref: '#/components/schemas/Fingerprint'

    SetUserFingerRequest:
      type: object
      required: [fingerData]
      properties:
        fingerData:
          type: string
          description: Base64-encoded fingerprint template.

    SetUserAllFingerRequest:
      type: object
      required: [fingerprints]
      properties:
        fingerprints:
          type: array
          items:
            $ref: '#/components/schemas/Fingerprint'

    # ------------------------------------------------------------------
    # Face credential schemas
    # ------------------------------------------------------------------
    GetUserFaceResponse:
      type: object
      required: [employeeNo, hasFace]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        hasFace:
          type: boolean
          description: Whether the user has registered face.
        faceData:
          type: string
          description: Base64-encoded face image (if available).

    SetUserFaceRequest:
      type: object
      required: [faceData]
      properties:
        faceData:
          type: string
          description: Base64-encoded face image or URL to the face image.

    # ------------------------------------------------------------------
    # Enrollment schemas
    # ------------------------------------------------------------------
    EnrollFingerRequest:
      type: object
      required: [employeeNo, fingerNo]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        fingerNo:
          type: integer
          minimum: 1
          maximum: 10
          description: Fingerprint slot number (1-10).

    EnrollFaceRequest:
      type: object
      required: [employeeNo]
      properties:
        employeeNo:
          type: string
          description: Employee number.

    EnrollVeinRequest:
      type: object
      required: [employeeNo]
      properties:
        employeeNo:
          type: string
          description: Employee number.

    EnrollResponse:
      type: object
      properties:
        message:
          type: string
          enum: [finger_enroll_started, face_enroll_started, vein_enroll_started]

    ValidPeriod:
      type: object
      properties:
        enable:
          type: boolean
        beginTime:
          type: string
          description: ISO 8601 datetime (YYYY-MM-DDTHH:MM:SS).
        endTime:
          type: string
          description: ISO 8601 datetime (YYYY-MM-DDTHH:MM:SS).

    # ------------------------------------------------------------------
    # Valid date data
    # ------------------------------------------------------------------
    SetUserValidDateRequest:
      type: object
      required: [employeeNo, beginDate, endDate, weekTimeZone]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        beginDate:
          type: string
          format: date
          description: Start date (YYYY-MM-DD).
        endDate:
          type: string
          format: date
          description: End date (YYYY-MM-DD).
        weekTimeZone:
          type: array
          items:
            type: integer
            enum: [0, 1]
          minItems: 7
          maxItems: 7
          description: 7 values (Mon-Sun), 1=active, 0=inactive.

    ValidDateData:
      type: object
      properties:
        employeeNo:
          type: string
        beginDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        weekTimeZone:
          type: array
          items:
            type: integer

    # ------------------------------------------------------------------
    # Attendance data
    # ------------------------------------------------------------------
    AttendanceData:
      type: object
      required: [records, total, page, limit, hasMore]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
        lastSyncedAt:
          type: string
          nullable: true

    AttendancePushPayload:
      type: object
      required:
        - event
        - cloudId
        - employeeNo
        - name
        - cardNo
        - verifyMode
        - attendanceStatus
        - eventTime
        - userType
        - picture
      properties:
        event:
          type: string
          enum: [attendance]
        cloudId:
          type: string
        employeeNo:
          type: string
        name:
          type: string
        cardNo:
          type: string
        verifyMode:
          type: string
        attendanceStatus:
          type: string
        eventTime:
          type: string
        userType:
          type: string
        picture:
          type: string
        workCode:
          type: string

    VerificationFailedPushPayload:
      type: object
      required:
        - event
        - cloudId
        - eventTime
        - reason
      properties:
        event:
          type: string
          enum: [verificationFailed]
        cloudId:
          type: string
        eventTime:
          type: string
          description: RFC 3339 timestamp.
        employeeNo:
          type: string
        name:
          type: string
        cardNo:
          type: string
        verifyMode:
          type: string
          description: "face, finger, card, password, or empty if unknown."
        reason:
          type: string
          description: Human-readable rejection reason.
        userType:
          type: string

    DoorEventPushPayload:
      type: object
      required:
        - event
        - cloudId
        - eventTime
        - doorNo
        - status
      properties:
        event:
          type: string
          enum: [doorOpen, doorClose, doorAlarm]
        cloudId:
          type: string
        eventTime:
          type: string
          description: RFC 3339 timestamp.
        doorNo:
          type: integer
        status:
          type: string
          description: "open, closed, forcedOpen, notClosed."

    DoorbellPushPayload:
      type: object
      required:
        - event
        - cloudId
        - eventTime
        - doorNo
      properties:
        event:
          type: string
          enum: [doorbell]
        cloudId:
          type: string
        eventTime:
          type: string
          description: RFC 3339 timestamp.
        doorNo:
          type: integer

    TamperPushPayload:
      type: object
      required:
        - event
        - cloudId
        - eventTime
        - subEventType
        - description
      properties:
        event:
          type: string
          enum: [tamper]
        cloudId:
          type: string
        eventTime:
          type: string
          description: RFC 3339 timestamp.
        subEventType:
          type: integer
        description:
          type: string

    DeviceEventPushPayload:
      type: object
      required:
        - event
        - cloudId
        - eventTime
        - majorEventType
        - subEventType
        - description
      properties:
        event:
          type: string
          enum: [alarm, exception, operation]
        cloudId:
          type: string
        eventTime:
          type: string
          description: RFC 3339 timestamp.
        majorEventType:
          type: integer
        subEventType:
          type: integer
        description:
          type: string

    UserChangePushPayload:
      type: object
      required:
        - event
        - cloudId
        - eventTime
        - employeeNo
        - changeType
      properties:
        event:
          type: string
          enum: [userChange]
        cloudId:
          type: string
        eventTime:
          type: string
          description: RFC 3339 timestamp.
        employeeNo:
          type: string
        changeType:
          type: string
          enum: [upsert, delete]
          description: "upsert = user added/modified, delete = user removed."
        credentials:
          type: array
          items:
            type: string
          description: "Credential types included: profile, face, finger, card, password, iris."
        name:
          type: string
        cardNo:
          type: string

    # ------------------------------------------------------------------
    # Webhook logs
    # ------------------------------------------------------------------
    WebhookLogsResponse:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            type: object
            properties:
              ID:
                type: integer
              CloudID:
                type: string
              ReferenceID:
                type: string
              CommandType:
                type: string
              WebhookURL:
                type: string
              RequestPayload:
                type: string
              Status:
                type: string
              ResponseCode:
                type: integer
                nullable: true
              RawResponse:
                type: string
                nullable: true
              ErrorMessage:
                type: string
                nullable: true
              RetryCount:
                type: integer
              CreatedAt:
                type: string
                format: date-time
        limit:
          type: integer

    WebhookResendResponse:
      type: object
      required: [status, log_id, message]
      properties:
        status:
          type: string
          enum: [queued]
        log_id:
          type: integer
          description: The ID of the newly created webhook log entry.
        message:
          type: string

    # ------------------------------------------------------------------
    # QR Code
    # ------------------------------------------------------------------
    AddUserQRRequest:
      type: object
      required: [qrcode]
      properties:
        qrcode:
          type: string
          description: QR code value to register for the user.

    QRCodeRecord:
      type: object
      required: [recno, userId, qrcode]
      properties:
        recno:
          type: string
          description: Record number on device.
        userId:
          type: string
          description: User ID (employee number).
        qrcode:
          type: string
          description: QR code value.

    GetQRResponse:
      type: object
      required: [employeeNo, qrcode]
      properties:
        employeeNo:
          type: string
          description: Employee number.
        qrcode:
          type: string
          description: QR code value.
