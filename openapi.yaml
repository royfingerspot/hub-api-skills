openapi: 3.1.0
info:
  title: Fingerspot HubAPI
  version: 2.0.0
  description: >
    Async device command API. Every command endpoint responds 200 with an
    acknowledgement immediately; the result is delivered later via a POST
    to the device's registered webhook URL. Synchronous endpoints
    (webhook-logs, attendance, webhook config) return data directly.
servers:
  - url: https://dev.int.api-new.fingerspot.io/api/external/
security:
  - BearerAuth: []
tags:
  - name: Device
    description: Device info, time, reboot
  - name: Users
    description: User CRUD
  - name: Credentials
    description: Fingerprint, card, face credential management
  - name: Timezone
    description: Device timezone configuration
  - name: Door
    description: Door control and status
  - name: Valid Date
    description: User validity period
  - name: Capture
    description: Live fingerprint and card capture
  - name: Attendance
    description: Attendance log queries
  - name: Webhook Logs
    description: Webhook delivery logs
  - name: Webhook Config
    description: Per-device webhook URL configuration
  - name: Devices (DEV ONLY)
    description: Device registration management

paths:

  # ==========================================================================
  # 1. GET /v1/{cloud_id} — Device Info
  # ==========================================================================
  /v1/{cloud_id}:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    get:
      tags: [Device]
      summary: Get device information
      description: >
        Synchronous endpoint — returns device information directly.
      operationId: getDevice
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      responses:
        '200':
          description: Device information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfoData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # 1.5 GET /v1/{cloud_id}/activity — Device Activity (sync)
  # ==========================================================================
  /v1/{cloud_id}/activity:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
    get:
      tags: [Device]
      summary: Get device connectivity status
      description: >
        Synchronous endpoint — returns the device's current connectivity
        status and last-seen timestamp directly. No webhook callback.
      operationId: getDeviceActivity
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      responses:
        '200':
          description: Device activity status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # 2. GET /v1/{cloud_id}/attendance — Attendance Logs
  # ==========================================================================
  /v1/{cloud_id}/attendance:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
    get:
      tags: [Attendance]
      summary: Get attendance logs
      description: >
        Synchronous endpoint — returns attendance logs directly from local database.
      operationId: getAttendance
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD).
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Attendance logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceData'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # 3. GET /v1/{cloud_id}/users — Get All Users
  # ==========================================================================
  /v1/{cloud_id}/users:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    get:
      tags: [Users]
      summary: Get all users
      operationId: getAllUsers
      x-supported-brands: [vida, vivo]
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: All users result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  type: array
                                  items:
                                    $ref: '#/components/schemas/UserInfo'
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

    # ========================================================================
    # 4. POST /v1/{cloud_id}/users — Create/Update User
    # ========================================================================
    post:
      tags: [Users]
      summary: Create or update a user
      description: >
        Sets user profile and all credentials in a single command.
        Creates the user if they don't exist, updates if they do.
      operationId: setUser
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserRequest'
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Set user result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  $ref: '#/components/schemas/OperationResult'
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 4.5 GET /v1/{cloud_id}/user-ids — Get All User IDs (Lightweight)
  # ==========================================================================
  /v1/{cloud_id}/user-ids:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    get:
      tags: [Users]
      summary: Get all user IDs (lightweight)
      description: >
        Returns only user IDs/PINs and count, without full user data.
        More efficient than getAllUsers for large user lists.
      operationId: getAllUserIds
      x-supported-brands: [revo, vega, vivo, vida, zkteco]
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: All user IDs result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  $ref: '#/components/schemas/GetAllUserIdsResult'
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 5. GET /v1/{cloud_id}/users/{id} — Get User by ID
  # ==========================================================================
  /v1/{cloud_id}/users/{id}:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    get:
      tags: [Users]
      summary: Get user by employee number
      operationId: getUser
      x-supported-brands: [vida, vivo, zkteco]
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Get user result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  $ref: '#/components/schemas/UserDetail'
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

    # ========================================================================
    # 6. DELETE /v1/{cloud_id}/users/{id} — Delete User
    # ========================================================================
    delete:
      tags: [Users]
      summary: Delete a user and all credentials
      operationId: deleteUser
      x-supported-brands: [vida, vivo, zkteco]
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Delete user result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  $ref: '#/components/schemas/OperationResult'
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 7. PUT /v1/{cloud_id}/time — Set Device Time
  # ==========================================================================
  /v1/{cloud_id}/time:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    put:
      tags: [Device]
      summary: Set device time
      description: >
        Sets the device's date/time and/or timezone. Accepts IANA timezone
        names (e.g. "Asia/Jakarta") or ISO 8601 offsets (+/-HH:MM).
      operationId: setTime
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                dateTime:
                  type: string
                  description: ISO 8601 datetime (YYYY-MM-DDTHH:MM:SS).
                timezone:
                  type: string
                  description: IANA timezone name or ISO 8601 offset (+/-HH:MM).
                mode:
                  type: string
                  enum: [ntp, manual]
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Set time result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  $ref: '#/components/schemas/OperationResult'
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 8. POST /v1/{cloud_id}/reboot — Reboot Device
  # ==========================================================================
  /v1/{cloud_id}/reboot:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    post:
      tags: [Device]
      summary: Reboot device
      operationId: reboot
      x-supported-brands: [vida]
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Reboot result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  type: object
                                  required: [message]
                                  properties:
                                    message:
                                      type: string
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 9. POST /v1/{cloud_id}/capture/finger — Capture Finger
  # ==========================================================================
  /v1/{cloud_id}/capture/finger:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    post:
      tags: [Capture]
      summary: Live fingerprint capture
      description: >
        Triggers the device to capture a fingerprint. Returns 400 with
        ERR_UNSUPPORTED if the device does not support this capability.
      operationId: captureFinger
      x-supported-brands: [vida, vivo, zkteco]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerNo]
              properties:
                fingerNo:
                  type: integer
                  minimum: 0
                  maximum: 10
                employeeNo:
                  type: string
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request body or unsupported operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Capture finger result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  type: object
                                  required: [fingerData, fingerNo, fingerPrintQuality]
                                  properties:
                                    fingerData:
                                      type: string
                                    fingerNo:
                                      type: integer
                                    fingerPrintQuality:
                                      type: integer
                                      minimum: 0
                                      maximum: 100
                                    setResult:
                                      type: object
                                      nullable: true
                                      description: Set result when employeeNo is provided (Vivo auto-set)
                                      properties:
                                        success:
                                          type: boolean
                                        message:
                                          type: string
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 10. POST /v1/{cloud_id}/capture/card — Capture Card
  # ==========================================================================
  /v1/{cloud_id}/capture/card:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
      - $ref: '#/components/parameters/WebhookUrlHeader'
    post:
      tags: [Capture]
      summary: Live card capture
      description: >
        Triggers the device to capture a card number. Returns 400 with
        ERR_UNSUPPORTED if the device does not support this capability.
      operationId: captureCard
      x-supported-brands: [vida, vivo]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                employeeNo:
                  type: string
                  description: Optional. Triggers auto-set when provided (Vivo only).
      responses:
        '200':
          description: Command queued. Result sent to webhook callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid request or unsupported operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      callbacks:
        deviceWebhook:
          '{$request.path#/cloud_id}':
            post:
              summary: Capture card result
              description: Posted to the device's registered webhook URL.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      oneOf:
                        - allOf:
                            - type: object
                              required: [referenceId, status, commandType, data]
                              properties:
                                referenceId:
                                  type: string
                                status:
                                  type: string
                                  enum: [success]
                                commandType:
                                  type: string
                                  description: >
                                    The command type that was executed (e.g. "getUser", "setUser",
                                    "setTime", "reboot", etc.).
                            - type: object
                              required: [data]
                              properties:
                                data:
                                  type: object
                                  required: [cardNo]
                                  properties:
                                    cardNo:
                                      type: string
                                    setResult:
                                      type: object
                                      nullable: true
                                      description: Set result when employeeNo is provided (Vivo auto-set)
                                      properties:
                                        success:
                                          type: boolean
                                        message:
                                          type: string
                        - $ref: '#/components/schemas/WebhookFailed'
              responses:
                '200':
                  description: Webhook acknowledged.
                '4XX':
                  description: Error (retried up to 5 times).

  # ==========================================================================
  # 11. GET /v1/{cloud_id}/webhook-logs — Webhook Logs
  # ==========================================================================
  /v1/{cloud_id}/webhook-logs:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - $ref: '#/components/parameters/ReferenceIdHeader'
    get:
      tags: [Webhook Logs]
      summary: Get webhook delivery logs
      description: >
        Synchronous endpoint — returns webhook delivery log entries directly.
        No acknowledgement or callback webhook.
      operationId: getWebhookLogs
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, success, failed]
          description: Filter by webhook delivery status.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter logs created on or after this date (YYYY-MM-DD).
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter logs created on or before this date (YYYY-MM-DD).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Webhook log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookLogsResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # 11.5 POST /v1/{cloud_id}/webhook-logs/{id}/resend — Resend Webhook
  # ==========================================================================
  /v1/{cloud_id}/webhook-logs/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/CloudIdParam'
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The webhook log ID to resend.
    post:
      tags: [Webhook Logs]
      summary: Resend a webhook
      description: >
        Synchronous endpoint — queues a new webhook delivery using the
        request payload and URL from an existing webhook log. Returns
        immediately with the new log ID. Delivery happens asynchronously.
        No request body needed.
      operationId: resendWebhook
      x-supported-brands: [vivo, vida, revo, vega, zkteco]
      responses:
        '200':
          description: Webhook resend queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResendResponse'
        '400':
          description: Invalid webhook log ID or log has no payload/URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Webhook log not found or cloud ID mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

